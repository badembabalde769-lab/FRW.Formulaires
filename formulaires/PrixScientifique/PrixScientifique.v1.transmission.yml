  options:
    fichierBind: PrixScientifique.bind.yml
- tache: ajouterEstampille
- tache: traiterDocumentsSoumis
- tache: envoyerCourriel
  options:
    gabarit: confirmation
gabaritsCourriels:
 - id: confirmation
   a:
     tous:
      - "clientis@economie.gouv.qc.ca"
   nomExpediteur: "FRW Prix scientifique"
   objet: "Nouvelle soumission Prix scientifique"
   corps: |
    <p>Bonjour,</p>
    <p>Une nouvelle soumission a été reçue pour le Prix scientifique</p>
    <p>Numéro de référence : {{NoConfirmation}}</p>
    <p>Voire les pièces jointes</p>
    <ul>
          {{#listePJ}}
        <li><a href="{{url}}">{{nomOriginal}}</a></li>
          {{/listePJ}}
        </ul>
